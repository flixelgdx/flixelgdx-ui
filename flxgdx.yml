# Manifest for the flxgdx CLI. Install this extension with:
#   flxgdx add library --repo flixelgdx/flixelgdx-ui
schema: 1

# Every artifact below is published under this Maven group.
group: org.flixelgdx

# Release tags look like v0.7.2, and the artifact version is 0.7.2.
version-from-tag: strip-v

packages:
  - name: flixelgdx-ui
    kind: library
    description: UI widget toolkit for FlixelGDX with panels, modals, buttons, text boxes, checkboxes, radio buttons, dropdowns, and tooltips.
    modules:
      # The UI is plain game code, so it only goes in the shared core module.
      core:
        libraries:
          - artifact: flixelgdx-ui
