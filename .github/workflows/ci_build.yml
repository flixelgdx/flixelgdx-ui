name: CI Build Check

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting check (Spotless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flixelgdx-ui
        uses: actions/checkout@v4
        with:
          path: flixelgdx-ui

      - name: Checkout flixelgdx
        uses: actions/checkout@v4
        with:
          repository: flixelgdx/flixelgdx
          ref: master
          path: flixelgdx

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: flixelgdx-ui
        run: chmod +x gradlew

      - name: Check formatting
        working-directory: flixelgdx-ui
        run: ./gradlew spotlessCheck --no-daemon --warning-mode all
        shell: bash

  quality:
    name: Code quality (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flixelgdx-ui
        uses: actions/checkout@v4
        with:
          path: flixelgdx-ui

      - name: Checkout flixelgdx
        uses: actions/checkout@v4
        with:
          repository: flixelgdx/flixelgdx
          ref: master
          path: flixelgdx

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: flixelgdx-ui
        run: chmod +x gradlew

      - name: Check code quality
        working-directory: flixelgdx-ui
        run: ./gradlew checkstyleMain --no-daemon --warning-mode all
        shell: bash

  javadoc:
    name: Javadoc (doclint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flixelgdx-ui
        uses: actions/checkout@v4
        with:
          path: flixelgdx-ui

      - name: Checkout flixelgdx
        uses: actions/checkout@v4
        with:
          repository: flixelgdx/flixelgdx
          ref: master
          path: flixelgdx

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: flixelgdx-ui
        run: chmod +x gradlew

      - name: Javadoc all Java modules
        working-directory: flixelgdx-ui
        run: |
          ./gradlew javadocAll --no-daemon --warning-mode all 2>&1 | tee "$RUNNER_TEMP/javadoc.log"
          # -Werror in the Javadoc options does not catch all doclint diagnostics (e.g. broken
          # @link references) in JDK 17, so we grep the captured output as a second gate.
          if grep -qE '\.java:[0-9]+: warning:' "$RUNNER_TEMP/javadoc.log"; then
            echo "" >&2
            echo "Javadoc produced source-level warnings (treating as errors):" >&2
            grep -E '\.java:[0-9]+: warning:' "$RUNNER_TEMP/javadoc.log" >&2
            exit 1
          fi
        shell: bash

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flixelgdx-ui
        uses: actions/checkout@v4
        with:
          path: flixelgdx-ui

      - name: Checkout flixelgdx
        uses: actions/checkout@v4
        with:
          repository: flixelgdx/flixelgdx
          ref: master
          path: flixelgdx

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: flixelgdx-ui
        run: chmod +x gradlew

      - name: Run JVM unit tests
        working-directory: flixelgdx-ui
        run: ./gradlew :flixelgdx-ui:test --no-daemon --warning-mode all
        shell: bash

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flixelgdx-ui
        uses: actions/checkout@v4
        with:
          path: flixelgdx-ui

      - name: Checkout flixelgdx
        uses: actions/checkout@v4
        with:
          repository: flixelgdx/flixelgdx
          ref: master
          path: flixelgdx

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: flixelgdx-ui
        run: chmod +x gradlew

      - name: Build
        working-directory: flixelgdx-ui
        run: ./gradlew :flixelgdx-ui:assemble --no-daemon --warning-mode all
        shell: bash
